[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.14.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false    # Можно поставить true для максимальной строгости
check_untyped_defs = true
ignore_missing_imports = true    # Полезно для сторонних библиотек без типов